version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicpress_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicpress
      POSTGRES_PASSWORD: civicpress
      POSTGRES_DB: civicpress
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U civicpress']
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    container_name: civicpress_adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
