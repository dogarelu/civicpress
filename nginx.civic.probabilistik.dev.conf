##############################################################################
# nginx server block — civicpress.ro
#
# Services (started via start-services-pm2.sh):
#   civic-public   -> 127.0.0.1:4200  (public site SSR)
#   civic-admin    -> 127.0.0.1:4300  (admin SPA, built with base=/admin/)
#   civic-backend  -> 127.0.0.1:3000  (NestJS API)
#
# Routing:
#   /v1/*          -> civic-backend
#   /admin         -> 301 /admin/
#   /admin/*       -> civic-admin
#   /*             -> civic-public
##############################################################################

server {
    listen 80;
    listen [::]:80;
    server_name civicpress.ro www.civicpress.ro;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name civicpress.ro www.civicpress.ro;

    ssl_certificate     /etc/letsencrypt/live/civicpress.ro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civicpress.ro/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 20m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_connect_timeout 10s;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/ {
        proxy_pass http://127.0.0.1:3000/v1/;
        proxy_buffering off;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:4300/admin/;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    # Compatibility path: if an upstream sets app base to /api,
    # Nitro page-data requests may become /api/_analog/*.
    location /api/_analog/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
    }
}
